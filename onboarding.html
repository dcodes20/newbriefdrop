<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <script src="theme.js"></script>
  <title>BriefDrop – What do you want to practise?</title>
  <meta name="description" content="Pick one or more skills to practise.">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preload" href="assets/fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="signin.css">
  <link rel="stylesheet" href="onboarding.css">
  <link rel="stylesheet" href="theme.css">
  <script src="onboarding.js" defer></script>
</head>
<body>

  <div class="glow" aria-hidden="true"></div>

  <main class="signin onb">
    <div class="panel">
      <header class="top" data-in>
        <a class="logo" href="index.html" aria-label="BriefDrop home"><img src="assets/briefdroplogo.png" width="40" height="38" alt=""><span class="logo__wordmark">BRIEFDROP</span></a>
      </header>

      <div class="steps" data-in>
        <span class="steps__sp" aria-hidden="true"></span>
        <div class="dots" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="Onboarding progress">
          <span class="dot is-on"></span><span class="dot"></span><span class="dot"></span>
        </div>
        <p class="steps__count">1 of 3</p>
      </div>

      <div class="head">
        <h1 class="title">What do you want to practise?</h1>
        <p class="sub" id="sub" data-in aria-live="polite">Pick one or more</p>
      </div>

      <div class="chips" id="chips" role="group" aria-labelledby="sub">
        <div class="row">
          <button class="chip" type="button" aria-pressed="false" style="--r:-3deg">UI/UX Design</button>
          <button class="chip" type="button" aria-pressed="false" style="--r:0deg">Illustration</button>
        </div>
        <div class="row">
          <button class="chip" type="button" aria-pressed="false" style="--r:4deg">Brand Design</button>
          <button class="chip" type="button" aria-pressed="false" style="--r:0deg">Motion Design</button>
        </div>
        <div class="row">
          <button class="chip" type="button" aria-pressed="false" style="--r:0deg">Graphics Design</button>
          <button class="chip" type="button" aria-pressed="false" style="--r:-4deg">Copywriting</button>
        </div>
        <div class="row">
          <button class="chip" type="button" aria-pressed="false" style="--r:-4deg">Video Editing</button>
          <button class="chip" type="button" aria-pressed="false" style="--r:0deg">Logo Design</button>
        </div>
        <div class="row">
          <button class="chip" type="button" aria-pressed="false" style="--r:3deg">Frontend Development</button>
        </div>
      </div>

      <button class="cta" id="next" type="button" data-in><span class="cta__label">Next</span></button>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
