<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <script src="theme.js"></script>
  <title>BriefDrop – Notifications</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preload" href="assets/fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="notifications.css">
  <link rel="stylesheet" href="notifications-list.css">
  <link rel="stylesheet" href="theme.css">
  <script src="icons.js" defer></script>
  <script src="notifications-list.js" defer></script>
</head>
<body>
  <header class="n-top" id="top">
    <div class="n-top__in">
      <a class="n-ico" id="back" href="home.html" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6" /></svg></a>
      <h1 class="n-title">Notifications</h1>
      <div class="n-more">
        <button class="n-ico" id="filter" type="button" aria-label="Filter notifications" aria-haspopup="menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z" /></svg><i class="n-dot" aria-hidden="true"></i></button>
        <div class="n-menu" id="menu" role="menu" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-f="all">All</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-f="unread">Unread</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-f="drop">Daily Drops</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-f="streak">Streaks</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-f="activity">Brief activity</button>
        </div>
      </div>
    </div>
  </header>

  <main class="n-main">
    <div class="n-tools" id="tools" hidden>
      <span class="n-count" id="count" aria-live="polite"></span>
      <button type="button" id="readall"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 7 17l-5-5" /> <path d="m22 10-7.5 7.5L13 16" /></svg><span>Mark all read</span></button>
      <button type="button" id="clearall"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 11v6" /> <path d="M14 11v6" /> <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /> <path d="M3 6h18" /> <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg><span>Clear all</span></button>
    </div>
    <ul class="n-list" id="list"></ul>

    <section class="n-empty" id="empty" aria-live="polite">
      <div class="n-art" id="art"><div class="n-art__f"><!-- Placeholder artwork: export Figma node 251:3549 as assets/no-notifications.png and change this src. --><img src="./assets/No-Notifications.png" width="402" height="402" alt="Someone relaxing on the floor beneath a muted bell."></div></div>
      <div class="n-copy">
        <h2 class="n-et" id="et">You’re all caught up</h2>
        <p class="n-es" id="es">Updates about saved briefs, progress and completed Ship Kits will appear here.</p>
        <p class="n-ep" id="ep">You can manage notification preferences in <a class="n-link" id="settings" href="settings.html?open=notifs&amp;from=notifications.html">Settings</a></p>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
