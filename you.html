<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <script src="theme.js"></script>
  <title>BriefDrop – You</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preload" href="assets/fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="you.css">
  <link rel="stylesheet" href="theme.css">
  <script src="icons.js" defer></script>
  <script src="you.js" defer></script>
</head>
<body class="you">
  <header class="y-top" id="top">
    <div class="y-top__in">
      <h1 class="y-title">You</h1>
      <a class="y-ico" id="settings" href="settings.html" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /> <circle cx="12" cy="12" r="3" /></svg></a>
    </div>
  </header>

  <main class="y-main">
    <section class="y-head" aria-label="Profile">
      <button class="y-av" id="av" type="button" aria-label="Change profile photo">
        <span class="y-av__i" id="av-i" aria-hidden="true"></span>
        <img id="av-img" alt="" hidden>
        <span class="y-av__cam" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /> <circle cx="12" cy="13" r="3" /></svg></span>
      </button>
      <input type="file" id="av-file" accept="image/*" hidden>
      <h2 class="y-name" id="name" contenteditable="plaintext-only" spellcheck="false" role="textbox" aria-label="Your name" enterkeyhint="done">Dcodes</h2>
      <p class="y-rank" id="rank"></p>
      <button class="y-streak" id="streak" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" /></svg><span id="st-t">4-day streak</span></button>
      <div class="y-prog">
        <div class="y-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="pbar"><i class="y-glow" id="pglow"></i><i class="y-fill" id="pfill"></i></div>
        <p class="y-next" id="next"></p>
      </div>
    </section>

    <section class="y-stats" id="stats" aria-label="Stats">
      <div class="y-stat"><b data-n="shipped">0</b><span>Builds shipped</span></div>
      <div class="y-stat"><b data-n="months">0</b><span>Total months</span></div>
      <div class="y-stat"><b data-n="streak">0</b><span>Current streak</span></div>
    </section>

    <section class="y-sec" id="skills-sec">
      <h2 class="y-h">What you’re practising</h2>
      <p class="y-sub">Skills you keep shipping vs the ones you avoid</p>
      <div class="y-skills" id="skills"></div>
    </section>

    <section class="y-sec" id="builds-sec">
      <div class="y-row"><h2 class="y-h">Recent builds</h2><button class="y-all" id="seeall" type="button">See all</button></div>
      <div class="y-builds" id="builds"></div>
    </section>

    <section class="y-sec y-badges">
      <h2 class="y-h">Badges</h2>
      <div class="y-bl" id="badges"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Main">
    <a class="tab" href="home.html" aria-label="Home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></a>
    <a class="tab" href="briefs.html" aria-label="Briefs"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 12h.01" /> <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" /> <path d="M22 13a18.15 18.15 0 0 1-20 0" /> <rect width="20" height="14" x="2" y="6" rx="2" /></svg></a>
    <a class="tab" href="active.html" aria-label="Active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" /> <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" /> <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></svg></a>
    <a class="tab is-on" href="you.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17.925 20.056a6 6 0 0 0-11.851.001" /> <circle cx="12" cy="11" r="4" /> <circle cx="12" cy="12" r="10" /></svg><span>You</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
