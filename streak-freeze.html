<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <script src="theme.js"></script>
  <title>BriefDrop – Streak freeze</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preload" href="assets/fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body { min-height: 100%; margin: 0; background: var(--bg); }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
    .fz { position: relative; z-index: 10; width: min(100%, 440px); padding: 32px 24px 24px; border: 1px solid var(--ink); border-radius: 24px; background: var(--card); text-align: center; }
    .fz.is-out { animation: fz-out .3s ease-in both; }
    @keyframes fz-out { to { opacity: 0; transform: translateY(10px) scale(.98); } }
    .fz[hidden] { display: none; }
    .fz { display: flex; flex-direction: column; align-items: center; gap: 16px; animation: fz-in .6s cubic-bezier(.2,1.15,.3,1) both; }
    .fz__flame { display: grid; place-items: center; width: 68px; height: 68px; flex: none; border-radius: 20px; color: var(--flame); background: rgba(250,174,31,.12); }
    .fz__flame svg { width: 38px; height: 38px; }
    .fz__t { font-family: var(--f-display); font-size: clamp(20px, 5vw, 26px); line-height: 1.3; }
    .fz__s { color: var(--muted); line-height: 1.5; }
    .fz__btns { display: flex; flex-direction: row; align-items: stretch; gap: 12px; width: 100%; margin-top: 8px; }
    .fz__go, .fz__no { flex: 1; width: auto; min-width: 0; min-height: 48px; margin-top: 0; padding: 10px 12px; font-size: 15px; white-space: normal; }
    .fz__no { display: inline-flex; align-items: center; justify-content: center; border: 1px solid #A0A0A0; border-radius: 14px; background: transparent; color: #A0A0A0; font-family: var(--f-btn); font-weight: 600; text-decoration: none; transition: background-color .2s, color .2s; }
    .fz__no:hover { background: transparent; color: var(--white); }
    @media (max-width: 360px) { .fz__btns { gap: 8px; } .fz__go, .fz__no { padding-inline: 8px; font-size: 14px; } }
    @media (prefers-reduced-motion: reduce) { .fz { animation: none; } }
  </style>
  <script src="streak-freeze.js" defer></script>
</head>
<body>
  <section class="fz" id="fz" role="alertdialog" aria-labelledby="fz-t" aria-describedby="fz-s">
    <div class="fz__flame" id="fz-flame" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4" /></svg></div>
    <h1 class="fz__t" id="fz-t">One free freeze this week</h1>
    <p class="fz__s" id="fz-s">Use it so a bad week doesn’t kill your streak.</p>
    <div class="fz__btns">
      <button class="cta cta--wide fz__go" type="button" id="fz-go">Freeze this week</button>
      <a class="fz__no" id="fz-no" href="home.html">Not now</a>
    </div>
  </section>
</body>
</html>
