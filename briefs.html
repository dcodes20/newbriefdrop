<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>BriefDrop – Briefs</title>
  <meta name="description" content="A fresh set of briefs every 24 hours.">
  <!-- Same brief source as home.html: your Claude-backed endpoint, with a local fallback. A new pool is made every 24 hours. -->
  <meta name="briefdrop-api" content="/api/briefs">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preload" href="assets/fonts/unbounded-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="briefs.css">
  <script src="icons.js" defer></script>
  <script src="brief-ai.js" defer></script>
  <script src="briefs.js" defer></script>
</head>
<body>

  <div class="b-top" id="top">
    <div class="b-top__in">
      <div class="b-head">
        <h1 class="b-title">Briefs</h1>
        <div class="b-icons">
          <button class="b-ico" id="funnel" type="button" aria-label="Sort briefs" aria-haspopup="dialog"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z" /></svg><i class="b-dot" aria-hidden="true"></i></button>
          <button class="b-ico" id="searchbtn" type="button" aria-label="Search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg></button>
        </div>
      </div>

      <label class="b-search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg>
        <input id="q" type="search" placeholder="Search by skill, industry or keyword…" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
        <button class="b-clear" id="qclear" type="button" aria-label="Clear search" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
      </label>

      <div class="b-pills" id="pills" role="toolbar" aria-label="Filters"></div>
    </div>
  </div>

  <main class="b-main">
    <div class="b-status" id="status" aria-live="polite">
      <span id="count">&nbsp;</span>
      <span class="b-sep" aria-hidden="true">·</span>
      <span class="b-drop" id="drop" title="A fresh set of briefs is made every 24 hours"></span>
      <span class="src" id="src" hidden></span>
    </div>
    <div class="b-grid" id="grid"></div>
    <div class="b-none" id="none" hidden>
      <img class="b-none__art" src="assets/empty%20brief.png" alt="An illustration of a person searching for a brief.">
      <p class="b-none__t">No briefs match.</p>
      <p class="b-none__s">Try fewer filters or a different word.</p>
      <button class="pbtn pbtn--ghost" id="reset" type="button">Clear filters</button>
    </div>
  </main>

  <nav class="tabs" aria-label="Main">
    <a class="tab" href="home.html" aria-label="Home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /> <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></a>
    <a class="tab is-on" href="briefs.html" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 12h.01" /> <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" /> <path d="M22 13a18.15 18.15 0 0 1-20 0" /> <rect width="20" height="14" x="2" y="6" rx="2" /></svg><span>Briefs</span></a>
    <a class="tab" href="active.html" aria-label="Active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" /> <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" /> <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></svg></a>
    <button class="tab" type="button" data-soon="Profile" aria-label="Profile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17.925 20.056a6 6 0 0 0-11.851.001" /> <circle cx="12" cy="11" r="4" /> <circle cx="12" cy="12" r="10" /></svg></button>
  </nav>

  <!-- brief details -->
  <dialog class="sheet" id="detail" aria-labelledby="d-title">
    <button class="sheet__x" type="button" aria-label="Close" data-close><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
    <div class="sheet__body">
      <p class="kick" id="d-kick"></p>
      <h2 class="sheet__title" id="d-title"></h2>
      <p class="sheet__sum" id="d-sum"></p>
      <div class="meta" id="d-meta"></div>
      <p class="sheet__h">What you’ll deliver</p>
      <ul class="checks" id="d-list"></ul>
      <p class="progress" id="d-prog" aria-live="polite"></p>
      <div class="sheet__btns">
        <button class="pbtn pbtn--primary" type="button" id="d-begin">Begin</button>
        <button class="pbtn pbtn--ghost" type="button" id="d-save" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z" /></svg><span>Save</span></button>
      </div>
    </div>
  </dialog>

  <!-- sort -->
  <dialog class="sheet" id="sortdlg" aria-labelledby="so-title">
    <button class="sheet__x" type="button" aria-label="Close" data-close><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
    <div class="sheet__body">
      <h2 class="sheet__title" id="so-title">Sort briefs</h2>
      <div class="opts opts--col" id="sortopts" role="radiogroup" aria-label="Sort by"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
