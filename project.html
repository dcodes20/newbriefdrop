  </div>

  <main class="p-main" id="main">
    <article class="p-doc" id="doc" aria-live="polite"></article>
  </main>

  <footer class="p-bar" id="bar">
    <div class="p-bar__in">
      <button class="p-btn p-btn--primary" id="start" type="button"><span>Start</span></button>
      <button class="p-btn" id="remix" type="button"><span>Remix</span></button>
      <button class="p-btn" id="reroll" type="button"><span>Reroll</span></button>
      <button class="p-btn" id="later" type="button" aria-pressed="false"><span>Save for later</span></button>
    </div>
  </footer>

  <!-- remix sheet (Figma 251:3843) -->
  <dialog class="sheet rx" id="rx" aria-labelledby="rx-t">
    <div class="rx__body">
      <h2 class="rx__t" id="rx-t">Remix this brief</h2>
      <div class="rx__opts" id="rx-opts" role="group" aria-label="Remix options">
        <button type="button" class="rx__o" data-k="industry" aria-pressed="false"><span>New industry</span><i><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5" /></svg></i></button>
        <button type="button" class="rx__o" data-k="audience" aria-pressed="false"><span>New audience</span><i><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5" /></svg></i></button>
        <button type="button" class="rx__o" data-k="wild" aria-pressed="false"><span>Wilder constraint</span><i><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5" /></svg></i></button>
        <button type="button" class="rx__o" data-k="easier" aria-pressed="false"><span>Easier</span><i><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5" /></svg></i></button>
        <button type="button" class="rx__o" data-k="harder" aria-pressed="false"><span>Harder</span><i><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5" /></svg></i></button>
      </div>
      <p class="rx__hint" id="rx-hint">Pick one or more. Nothing picked? We’ll surprise you.</p>
    </div>
    <div class="rx__bar"><button class="p-btn p-btn--primary" id="rx-apply" type="button"><span>Apply remix</span></button></div>
  </dialog>

  <!-- reroll confirmation (Figma 251:3932) -->
  <dialog class="sheet rx rr" id="rr" aria-labelledby="rr-t" aria-describedby="rr-s">
    <div class="rx__body rr__body">
      <h2 class="rx__t rr__t" id="rr-t">Fresh one coming</h2>
      <p class="rr__s" id="rr-s">This brief will be replaced.</p>
      <p class="rr__note" id="rr-note" hidden></p>
      <div class="rr__btns">
        <button class="p-btn p-btn--primary" id="rr-go" type="button"><span>Reroll</span></button>
        <button class="p-btn" id="rr-keep" type="button"><span>Keep this one</span></button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
